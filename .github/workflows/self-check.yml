name: self-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-self-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Run repository-owned checks
        run: python ci/self_check.py
